name: Auto-Sync Lockfile on Release PR

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lockfile:
    name: Sync uv.lock with pyproject.toml
    # Only run on release-please branches to prevent desync on merge
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Regenerate uv.lock
        run: |
          uv lock
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): auto-sync uv.lock for release version [skip ci]"
            git push
          else
            echo "uv.lock is already up-to-date."
          fi
