<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - LiveKit Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.15), transparent 70%);
            filter: blur(60px);
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }
        .orb-1 { top: -200px; left: -200px; }
        .orb-2 { bottom: -200px; right: -200px; animation-delay: -10s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradient 5s ease infinite;
        }
        
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 1rem;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: monospace;
            margin-bottom: 1rem;
        }
        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .status.connected::before { background: #4ade80; animation: pulse 2s infinite; }
        .status.listening::before { background: #22d3ee; animation: pulse 1s infinite; }
        .status.speaking::before { background: #a78bfa; animation: pulse 0.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .transcript {
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 1rem;
        }
        .transcript::-webkit-scrollbar { width: 4px; }
        .transcript::-webkit-scrollbar-track { background: transparent; }
        .transcript::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        
        .message { margin-bottom: 1rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
            margin-bottom: 0.25rem;
        }
        .message.user .label { color: #22d3ee; }
        .message.assistant .label { color: #a78bfa; }
        .message .text { line-height: 1.5; }
        
        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        .mic-button::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .mic-button:hover::before { opacity: 1; }
        .mic-button:hover { transform: scale(1.05); }
        .mic-button:active { transform: scale(0.95); }
        .mic-button.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: micPulse 1.5s infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }
        
        .mic-button svg {
            width: 32px;
            height: 32px;
            fill: white;
            position: relative;
            z-index: 1;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 40px;
            margin: 1rem 0;
        }
        .visualizer .bar {
            width: 4px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 2px;
            animation: visualize 0.5s ease infinite;
            opacity: 0;
        }
        .visualizer.active .bar { opacity: 1; }
        @keyframes visualize {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div class="container">
        <h1>JARVIS</h1>
        <p class="subtitle">LiveKit Voice Assistant</p>
        
        <div class="glass-panel">
            <div class="status" id="status">Disconnected</div>
            
            <div class="visualizer" id="visualizer">
                <div class="bar" style="animation-delay: 0s"></div>
                <div class="bar" style="animation-delay: 0.1s"></div>
                <div class="bar" style="animation-delay: 0.2s"></div>
                <div class="bar" style="animation-delay: 0.3s"></div>
                <div class="bar" style="animation-delay: 0.4s"></div>
                <div class="bar" style="animation-delay: 0.5s"></div>
                <div class="bar" style="animation-delay: 0.6s"></div>
            </div>
            
            <div class="transcript" id="transcript">
                <div style="color: #666; text-align: center; padding: 2rem;">
                    Click the microphone to start talking...
                </div>
            </div>
            
            <button class="mic-button" id="micButton" onclick="toggleConnection()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            
            <div class="controls">
                <button class="btn" onclick="clearTranscript()">Clear</button>
                <button class="btn hidden" id="disconnectBtn" onclick="disconnect()">End Call</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script>
        let room = null;
        let isConnected = false;
        let isSpeaking = false;
        
        const LIVEKIT_URL = 'wss://shore-eoiag4jd.livekit.cloud';
        
        function updateStatus(status, text) {
            const el = document.getElementById('status');
            el.className = 'status ' + status;
            el.textContent = text;
            
            const viz = document.getElementById('visualizer');
            viz.classList.toggle('active', status === 'listening' || status === 'speaking');
        }
        
        let interimEl = null;
        function updateInterimTranscript(text) {
            const transcript = document.getElementById('transcript');
            if (!interimEl) {
                interimEl = document.createElement('div');
                interimEl.className = 'message user interim';
                transcript.appendChild(interimEl);
            }
            interimEl.textContent = text;
            transcript.scrollTop = transcript.scrollHeight;
        }
        
        function clearInterimTranscript() {
            if (interimEl) {
                interimEl.remove();
                interimEl = null;
            }
        }
        
        function addMessage(role, text) {
            const transcript = document.getElementById('transcript');
            if (transcript.children.length === 1 && transcript.children[0].style.color === 'rgb(102, 102, 102)') {
                transcript.innerHTML = '';
            }
            
            // Clear interim transcript when final message arrives
            if (role === 'user') {
                clearInterimTranscript();
            }
            
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `
                <div class="label">${role === 'user' ? 'You' : 'JARVIS'}</div>
                <div class="text">${text}</div>
            `;
            transcript.appendChild(div);
            transcript.scrollTop = transcript.scrollHeight;
        }
        
        function clearTranscript() {
            document.getElementById('transcript').innerHTML = `
                <div style="color: #666; text-align: center; padding: 2rem;">
                    Transcript cleared...
                </div>
            `;
        }
        
        async function generateToken(roomName, identity) {
            // Fetch token from token server
            const resp = await fetch(`/jarvis-livekit/token?room=${roomName}&identity=${identity}`);
            const data = await resp.json();
            return data.token;
        }
        
        async function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }
        
        async function connect() {
            try {
                updateStatus('connecting', 'Connecting...');
                
                // Use URL param or default room
                const urlParams = new URLSearchParams(window.location.search);
                const roomName = urlParams.get('room') || 'jarvis-voice-room';
                
                // Fetch token with error handling
                let token;
                try {
                    const resp = await fetch(`/jarvis-livekit/token?room=${roomName}&identity=schnee`);
                    if (!resp.ok) throw new Error('Token fetch failed: ' + resp.status);
                    const data = await resp.json();
                    token = data.token;
                    addMessage('assistant', 'Got token, connecting to LiveKit...');
                } catch (e) {
                    addMessage('assistant', 'Token error: ' + e.message);
                    updateStatus('disconnected', 'Token Error');
                    return;
                }
                
                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                    audioCaptureDefaults: {
                        autoGainControl: true,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });
                
                room.on(LivekitClient.RoomEvent.Connected, async () => {
                    addMessage('assistant', 'Connected to room: ' + roomName);
                    updateStatus('listening', 'Listening...');
                    isConnected = true;
                    
                    try {
                        await room.localParticipant.setMicrophoneEnabled(true);
                        addMessage('assistant', 'Mic enabled!');
                    } catch (e) {
                        addMessage('assistant', 'Mic error: ' + e.message);
                    }
                });
                
                room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
                    addMessage('assistant', 'Disconnected: ' + reason);
                    updateStatus('disconnected', 'Disconnected');
                    isConnected = false;
                });
                
                room.on(LivekitClient.RoomEvent.ConnectionStateChanged, (state) => {
                    addMessage('assistant', 'Connection state: ' + state);
                });
                
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    console.log('Track subscribed:', track.kind);
                    if (track.kind === 'audio') {
                        const audioElement = track.attach();
                        document.body.appendChild(audioElement);
                        audioElement.play();
                        updateStatus('speaking', 'JARVIS is speaking...');
                        
                        track.on('ended', () => {
                            updateStatus('listening', 'Listening...');
                        });
                    }
                });
                
                // Listen for transcription events (user speech)
                room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
                    console.log('Transcription received:', segments);
                    segments.forEach(segment => {
                        if (segment.final) {
                            addMessage('user', segment.text);
                        } else {
                            updateInterimTranscript(segment.text);
                        }
                    });
                });
                
                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                    if (isConnected) {
                        updateStatus('listening', 'Listening...');
                    }
                });
                
                room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
                    if (speakers.length > 0 && speakers[0].identity !== 'schnee') {
                        updateStatus('speaking', 'JARVIS is speaking...');
                    } else if (isConnected) {
                        updateStatus('listening', 'Listening...');
                    }
                });
                
                await room.connect(LIVEKIT_URL, token);
                addMessage('assistant', 'Room connect called, waiting for events...');
                
            } catch (error) {
                addMessage('assistant', 'Connection error: ' + error.message);
                updateStatus('disconnected', 'Error: ' + error.message);
            }
        }
        
        function disconnect() {
            if (room) {
                room.disconnect();
                room = null;
            }
            isConnected = false;
            updateStatus('disconnected', 'Disconnected');
        }
    </script>
</body>
</html>
