<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - LiveKit Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
        }
        .status {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .status.connected { border-left: 4px solid #4ade80; }
        .status.disconnected { border-left: 4px solid #ef4444; }
        .transcript {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
        }
        .transcript .user { color: #22d3ee; margin-bottom: 0.5rem; }
        .transcript .assistant { color: #a78bfa; margin-bottom: 0.5rem; }
        .transcript .label { font-size: 0.75rem; opacity: 0.6; margin-bottom: 0.25rem; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 0.5rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .mic-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            margin: 1rem auto;
            animation: pulse 1s infinite;
            display: none;
        }
        .mic-indicator.active { display: block; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JARVIS</h1>
        <p class="subtitle">LiveKit Voice Assistant Test</p>
        
        <div id="status" class="status disconnected">
            Status: Disconnected
        </div>
        
        <div class="mic-indicator" id="micIndicator"></div>
        
        <div id="transcript" class="transcript">
            <div style="color: #666; text-align: center; padding: 2rem;">
                Transcript will appear here...
            </div>
        </div>
        
        <div>
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script>
        let room = null;
        let localTrack = null;
        
        const LIVEKIT_URL = 'ws://localhost:7880';
        const TOKEN = ''; // Will generate token
        
        function addMessage(role, text) {
            const transcript = document.getElementById('transcript');
            const div = document.createElement('div');
            div.className = role;
            div.innerHTML = `<div class="label">${role === 'user' ? 'You' : 'JARVIS'}</div>${text}`;
            transcript.appendChild(div);
            transcript.scrollTop = transcript.scrollHeight;
        }
        
        function updateStatus(connected, text) {
            const status = document.getElementById('status');
            status.className = 'status ' + (connected ? 'connected' : 'disconnected');
            status.textContent = 'Status: ' + text;
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('micIndicator').className = 'mic-indicator' + (connected ? ' active' : '');
        }
        
        async function generateToken() {
            // For dev mode, we use a simple token generation
            // In production, this should come from your backend
            const apiKey = 'devkey';
            const apiSecret = 'secret';
            
            // Create JWT manually for dev
            const header = { alg: 'HS256', typ: 'JWT' };
            const now = Math.floor(Date.now() / 1000);
            const payload = {
                exp: now + 3600,
                iat: now,
                iss: apiKey,
                nbf: now - 10,
                sub: 'test-user',
                video: { roomJoin: true, room: 'test-room' }
            };
            
            // Sign with secret (simplified - use proper JWT library in production)
            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
                'raw', enc.encode(apiSecret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            
            const b64 = (obj) => btoa(JSON.stringify(obj)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            const sigInput = `${b64(header)}.${b64(payload)}`;
            const sig = await crypto.subtle.sign('HMAC', key, enc.encode(sigInput));
            const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            
            return `${sigInput}.${sigB64}`;
        }
        
        async function connect() {
            try {
                updateStatus(false, 'Connecting...');
                
                const token = await generateToken();
                
                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });
                
                // Set up event listeners
                room.on(LivekitClient.RoomEvent.Connected, () => {
                    console.log('Connected to room');
                    updateStatus(true, 'Connected - Speak now!');
                    addMessage('assistant', 'Connected! JARVIS is listening...');
                });
                
                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    console.log('Disconnected');
                    updateStatus(false, 'Disconnected');
                });
                
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    console.log('Track subscribed:', track.kind);
                    if (track.kind === 'audio') {
                        const audioElement = track.attach();
                        document.body.appendChild(audioElement);
                        audioElement.play();
                    }
                });
                
                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });
                
                // Connect to room
                await room.connect(LIVEKIT_URL, token);
                
                // Enable microphone
                await room.localParticipant.setMicrophoneEnabled(true);
                
            } catch (error) {
                console.error('Connection failed:', error);
                updateStatus(false, 'Error: ' + error.message);
                addMessage('assistant', 'Connection failed: ' + error.message);
            }
        }
        
        function disconnect() {
            if (room) {
                room.disconnect();
                room = null;
            }
            updateStatus(false, 'Disconnected');
        }
    </script>
</body>
</html>
